---
features:
  - |
    Added ``barbican-manage secret migrate``, an operator subcommand
    that discovers secrets from the Barbican database and moves them
    onto another configured secret store by calling
    ``plugin.resources.rewrap_secret`` in-process. It can migrate
    every payload secret in a specified Keystone project, or every
    payload secret currently stored on a specified backend (all
    projects). Failures are recorded and the command continues; a
    non-zero exit status is returned if any secret fails. Payloads
    are never printed.
