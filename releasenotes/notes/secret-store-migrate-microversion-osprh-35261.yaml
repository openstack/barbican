---
features:
  - |
    Added microversion 1.3 with
    ``PUT /v1/secrets/{secret-id}/secret-store/{secret-store-id}``
    to migrate an existing secret onto another configured secret
    store without changing the secret UUID. The request body is
    empty. Project admins may target any store; project members may
    migrate only to the project preferred store. Multiple secret
    store backends must be enabled. Secret metadata GET/list always
    return computed ``secret_store_id`` / ``secret_store_ref`` on
    microversion 1.3+ (``null`` when multiple backends are disabled
    or the secret has no payload). A live payload that cannot be
    mapped to exactly one catalogue store returns HTTP 500.
    ``GET /v1/secret-stores`` (and get-by-id / preferred /
    global-default) also return ``secret_store_id`` so clients need
    not parse ``secret_store_ref``. See blueprint
    admin-migrate-secret-store.
